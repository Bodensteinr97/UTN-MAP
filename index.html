<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>UTN Eléctrica Map · Plan 2023</title><style>
:root{--bg:#181a1c;--panel:#25282b;--text:#f4f5f6;--muted:#aeb4bb;--line:#555b62;--reg:#48a9e6;--app:#f19a55;--ok:#4fca83;--doing:#e7c25c}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
header{height:112px;background:#303234;border-bottom:1px solid #414448;display:flex;align-items:center;padding:14px 18px;gap:16px;justify-content:space-between}
.brand b{display:block;font-size:18px}.brand small{color:var(--muted)}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{background:#383b3e;color:#fff;border:1px solid #62676c;border-radius:9px;padding:9px 11px;cursor:pointer}.btn.on{border-color:#fff}.legend{font-size:11px;color:var(--muted)}.dot{display:inline-block;width:18px;height:3px;vertical-align:middle;margin:0 4px 0 9px}.dot.r{background:var(--reg)}.dot.a{background:var(--app)}
#viewport{position:absolute;top:112px;bottom:0;left:0;right:0;overflow:hidden;touch-action:none;background-image:radial-gradient(#303438 1px,transparent 1px);background-size:24px 24px}
#world{position:absolute;left:0;top:0;width:1700px;height:920px;transform-origin:0 0}svg{position:absolute;inset:0;width:1700px;height:920px;overflow:visible}
.edge{fill:none;stroke-width:1.6;opacity:.55}.edge.reg{stroke:var(--reg)}.edge.app{stroke:var(--app);stroke-dasharray:6 4}.edge.dim{opacity:.06}.edge.hot{opacity:1;stroke-width:3}
.node{position:absolute;width:172px;min-height:58px;background:#3b3e42;border:2px solid #70757b;border-radius:9px;padding:8px 10px;box-shadow:0 3px 8px #0005;cursor:grab;user-select:none;touch-action:none}.node:active{cursor:grabbing}.node .num{font-size:10px;color:#bfc4c9}.node .name{font-size:12px;line-height:1.18;font-weight:650}.node .state{font-size:9px;margin-top:5px;color:#c9ced3}.node.available{border-color:#aab0b5}.node.cursando{border-color:var(--doing)}.node.regularizada{border-color:var(--reg);background:#29475a}.node.aprobada{border-color:var(--ok);background:#28503b}.node.dim{opacity:.16}.node.hot{box-shadow:0 0 0 3px #fff5}
.year{position:absolute;top:20px;color:#8e959c;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid #3a3e42;padding-bottom:5px;width:230px}
.fab{position:absolute;right:14px;bottom:14px;display:grid;gap:7px}.fab button{width:44px;height:44px;border-radius:50%;border:1px solid #686d72;background:#303336;color:#fff;font-size:19px}
#panel{position:absolute;right:14px;top:14px;width:290px;background:#292c2fdd;backdrop-filter:blur(8px);border:1px solid #51565b;border-radius:13px;padding:14px;display:none;z-index:8}#panel h3{font-size:15px;margin:0 0 5px}#panel p{font-size:11px;color:var(--muted);margin:5px 0 10px}.states{display:grid;grid-template-columns:1fr 1fr;gap:6px}.states button{font-size:11px;padding:8px;background:#35383b;color:#fff;border:1px solid #5c6166;border-radius:7px}.req{font-size:10px;color:#c7ccd1;margin-top:10px;line-height:1.45}.close{float:right;background:none;border:0;color:white;font-size:18px}
@media(max-width:700px){header{height:126px;padding:10px}.brand b{font-size:15px}.brand small{font-size:10px}.legend{display:none}#viewport{top:126px}#panel{left:10px;right:10px;top:10px;width:auto}.btn{font-size:11px;padding:8px}.node{width:154px}.tools{justify-content:flex-end}}
</style></head><body>
<header><div class="brand"><b>Ingeniería en Energía Eléctrica</b><small>UTN · Plan 2023 · Ord. 1873</small></div><div class="tools"><span class="legend"><i class="dot r"></i>Regularizada <i class="dot a"></i>Aprobada</span><button class="btn" id="all">Todo</button><button class="btn" id="req">Requisitos</button><button class="btn" id="unlock">Desbloquea</button><button class="btn" id="google">Google</button></div></header>
<div id="viewport"><div id="world"><svg id="edges"><defs><marker id="arrowR" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#48a9e6"/></marker><marker id="arrowA" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#f19a55"/></marker></defs></svg><div id="nodes"></div></div>
<div id="panel"><button class="close" id="close">×</button><h3 id="pt"></h3><p id="ps"></p><div class="states"><button data-s="pendiente">Pendiente</button><button data-s="cursando">Cursando</button><button data-s="regularizada">Regularizada</button><button data-s="aprobada">Aprobada</button></div><div class="req" id="pr"></div></div>
<div class="fab"><button id="plus">+</button><button id="minus">−</button><button id="fit">⌂</button></div></div>
<script>
const S=[{"id": 1, "year": 1, "name": "Análisis Matemático I", "regular": [], "approved": []}, {"id": 2, "year": 1, "name": "Álgebra y Geometría Analítica", "regular": [], "approved": []}, {"id": 3, "year": 1, "name": "Ingeniería y Sociedad", "regular": [], "approved": []}, {"id": 4, "year": 1, "name": "Sistemas de Representación", "regular": [], "approved": []}, {"id": 5, "year": 1, "name": "Física I", "regular": [], "approved": []}, {"id": 6, "year": 1, "name": "Química General", "regular": [], "approved": []}, {"id": 7, "year": 1, "name": "Integración Eléctrica I", "regular": [], "approved": []}, {"id": 8, "year": 1, "name": "Fundamentos de Informática", "regular": [], "approved": []}, {"id": 9, "year": 2, "name": "Física II", "regular": [1, 5], "approved": []}, {"id": 10, "year": 2, "name": "Probabilidad y Estadística", "regular": [1, 2], "approved": []}, {"id": 11, "year": 2, "name": "Electrotecnia I", "regular": [1, 2, 5], "approved": []}, {"id": 12, "year": 2, "name": "Estabilidad", "regular": [1, 2, 5], "approved": []}, {"id": 13, "year": 2, "name": "Mecánica Técnica", "regular": [1, 5], "approved": []}, {"id": 14, "year": 2, "name": "Integración Eléctrica II", "regular": [1, 5, 7], "approved": []}, {"id": 15, "year": 2, "name": "Inglés I", "regular": [], "approved": []}, {"id": 16, "year": 2, "name": "Análisis Matemático II", "regular": [1, 2], "approved": []}, {"id": 17, "year": 2, "name": "Cálculo Numérico", "regular": [1, 2, 5, 8], "approved": []}, {"id": 18, "year": 3, "name": "Tecnologías y Ensayos de Materiales Eléctricos", "regular": [6, 9], "approved": [1, 5]}, {"id": 19, "year": 3, "name": "Instrumentos y Mediciones Eléctricas", "regular": [10, 11], "approved": [1, 2, 5]}, {"id": 20, "year": 3, "name": "Teoría de los Campos", "regular": [9, 16], "approved": [1, 2, 5]}, {"id": 21, "year": 3, "name": "Física III", "regular": [9, 16], "approved": [1, 2, 5]}, {"id": 22, "year": 3, "name": "Máquinas Eléctricas I", "regular": [9, 11, 16, 17], "approved": [1, 5]}, {"id": 23, "year": 3, "name": "Electrotecnia II", "regular": [9, 11, 16], "approved": [1, 2, 5]}, {"id": 24, "year": 3, "name": "Termodinámica", "regular": [9, 16], "approved": [1, 2, 5]}, {"id": 25, "year": 3, "name": "Fundamentos para el Análisis de Señales", "regular": [16, 17], "approved": [1, 2]}, {"id": 26, "year": 3, "name": "Taller Interdisciplinario", "regular": [9, 11, 16, 17], "approved": [1, 5]}, {"id": 27, "year": 4, "name": "Inglés II", "regular": [], "approved": [15]}, {"id": 28, "year": 4, "name": "Economía", "regular": [], "approved": [3]}, {"id": 29, "year": 4, "name": "Electrónica I", "regular": [11], "approved": [1, 5]}, {"id": 30, "year": 4, "name": "Máquinas Eléctricas II", "regular": [18, 19, 20, 22, 23], "approved": [6, 9, 10, 11, 15, 16]}, {"id": 31, "year": 4, "name": "Seguridad, Riesgo Eléctrico y Medio Ambiente", "regular": [6, 11, 18, 20], "approved": [1, 2, 5, 9, 16]}, {"id": 32, "year": 4, "name": "Instalaciones Eléctricas y Luminotecnia", "regular": [18, 22, 23], "approved": [6, 9, 11, 14, 15, 16]}, {"id": 33, "year": 4, "name": "Control Automático", "regular": [23, 25], "approved": [11, 16]}, {"id": 34, "year": 4, "name": "Máquinas Térmicas, Hidráulicas y de Fluido", "regular": [12, 13, 24], "approved": [9, 16]}, {"id": 35, "year": 4, "name": "Legislación", "regular": [], "approved": [3]}, {"id": 36, "year": 5, "name": "Electrónica II", "regular": [23, 29], "approved": [11, 26]}, {"id": 37, "year": 5, "name": "Generación, Transmisión y Distribución de la Energía Eléctrica", "regular": [21, 30, 34], "approved": [12, 13, 18, 22, 23, 24]}, {"id": 38, "year": 5, "name": "Sistemas de Potencia", "regular": [30, 33], "approved": [18, 22, 23, 26]}, {"id": 39, "year": 5, "name": "Accionamientos y Controles Eléctricos", "regular": [29, 30, 33], "approved": [11, 18, 22, 23, 25, 26]}, {"id": 40, "year": 5, "name": "Organización y Administración de Empresas", "regular": [28, 35], "approved": [26]}, {"id": 41, "year": 5, "name": "Proyecto Final", "regular": [28, 30, 32, 33], "approved": [18, 19, 22, 23, 25, 26, 27]}], by=Object.fromEntries(S.map(x=>[x.id,x])), pos={}, rank={pendiente:0,cursando:1,regularizada:2,aprobada:3};
let prog=JSON.parse(localStorage.getItem("utn-map-progress")||"{}"), selected=null, mode="all", scale=.72, tx=25,ty=55, pan=null;
const vp=document.querySelector("#viewport"), world=document.querySelector("#world"), ns=document.querySelector("#nodes"), svg=document.querySelector("#edges");
const st=id=>prog[id]||"pendiente"; const can=s=>s.regular.every(i=>rank[st(i)]>=2)&&s.approved.every(i=>st(i)==="aprobada");
function initial(){for(let y=1;y<=5;y++){let arr=S.filter(s=>s.year===y), x=70+(y-1)*315;arr.forEach((s,k)=>pos[s.id]={x,y:80+k*82})}}
function drawNodes(){ns.innerHTML="";document.querySelectorAll(".year").forEach(x=>x.remove());for(let y=1;y<=5;y++){let h=document.createElement("div");h.className="year";h.style.left=(70+(y-1)*315)+"px";h.textContent=y+"° nivel";world.appendChild(h)}
 S.forEach(s=>{let n=document.createElement("div");n.className=`node ${st(s.id)} ${can(s)?"available":""}`;n.dataset.id=s.id;n.style.left=pos[s.id].x+"px";n.style.top=pos[s.id].y+"px";n.innerHTML=`<div class=num>#${s.id}</div><div class=name>${s.name}</div><div class=state>${st(s.id)}${st(s.id)==="pendiente"?(can(s)?" · habilitada":" · bloqueada"):""}</div>`;ns.appendChild(n);dragNode(n,s);n.addEventListener("click",e=>{if(!n.moved)select(s)})});drawEdges();highlight()}
function path(a,b){let A=pos[a],B=pos[b],x1=A.x+172,y1=A.y+29,x2=B.x,y2=B.y+29,c=(x2-x1)*.5;return `M${x1},${y1} C${x1+c},${y1} ${x2-c},${y2} ${x2},${y2}`}
function drawEdges(){svg.querySelectorAll(".edge").forEach(e=>e.remove());S.forEach(s=>{s.regular.forEach(a=>edge(a,s.id,"reg"));s.approved.forEach(a=>edge(a,s.id,"app"))})}
function edge(a,b,t){let p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("d",path(a,b));p.setAttribute("class","edge "+t);p.dataset.a=a;p.dataset.b=b;p.setAttribute("marker-end",`url(#arrow${t==="reg"?"R":"A"})`);svg.appendChild(p)}
function dragNode(n,s){let d=null;n.addEventListener("pointerdown",e=>{e.stopPropagation();n.setPointerCapture(e.pointerId);d={x:e.clientX,y:e.clientY,ox:pos[s.id].x,oy:pos[s.id].y};n.moved=false});n.addEventListener("pointermove",e=>{if(!d)return;let dx=(e.clientX-d.x)/scale,dy=(e.clientY-d.y)/scale;if(Math.abs(dx)+Math.abs(dy)>4)n.moved=true;pos[s.id].x=d.ox+dx;pos[s.id].y=d.oy+dy;n.style.left=pos[s.id].x+"px";n.style.top=pos[s.id].y+"px";drawEdges();highlight()});n.addEventListener("pointerup",()=>d=null)}
function select(s){selected=s;document.querySelector("#panel").style.display="block";document.querySelector("#pt").textContent=s.name;document.querySelector("#ps").textContent=`${st(s.id)} · ${can(s)?"habilitada para cursar":"aún no habilitada"}`;let fmt=a=>a.length?a.map(i=>by[i].name).join("<br>"):"—";document.querySelector("#pr").innerHTML=`<b>Requiere regularizadas</b><br>${fmt(s.regular)}<br><br><b>Requiere aprobadas</b><br>${fmt(s.approved)}`;highlight()}
function ancestors(id,set=new Set()){let s=by[id];[...s.regular,...s.approved].forEach(i=>{if(!set.has(i)){set.add(i);ancestors(i,set)}});return set}
function descendants(id,set=new Set()){S.forEach(s=>{if([...s.regular,...s.approved].includes(id)&&!set.has(s.id)){set.add(s.id);descendants(s.id,set)}});return set}
function highlight(){let keep=null;if(selected&&mode==="req")keep=ancestors(selected.id),keep.add(selected.id);if(selected&&mode==="unlock")keep=descendants(selected.id),keep.add(selected.id);document.querySelectorAll(".node").forEach(n=>{n.classList.toggle("dim",keep&&!keep.has(+n.dataset.id));n.classList.toggle("hot",selected&&+n.dataset.id===selected.id)});document.querySelectorAll(".edge").forEach(e=>{let hot=keep&&keep.has(+e.dataset.a)&&keep.has(+e.dataset.b);e.classList.toggle("dim",keep&&!hot);e.classList.toggle("hot",!!hot)})}
function transform(){world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}
vp.addEventListener("pointerdown",e=>{if(e.target===vp||e.target===world||e.target===svg){pan={x:e.clientX,y:e.clientY,tx,ty};vp.setPointerCapture(e.pointerId)}});vp.addEventListener("pointermove",e=>{if(pan){tx=pan.tx+e.clientX-pan.x;ty=pan.ty+e.clientY-pan.y;transform()}});vp.addEventListener("pointerup",()=>pan=null);
vp.addEventListener("wheel",e=>{e.preventDefault();scale=Math.max(.3,Math.min(1.5,scale*(e.deltaY>0?.9:1.1)));transform()},{passive:false});
document.querySelector("#plus").onclick=()=>{scale=Math.min(1.5,scale*1.15);transform()};document.querySelector("#minus").onclick=()=>{scale=Math.max(.3,scale/1.15);transform()};document.querySelector("#fit").onclick=()=>{scale=Math.min(.8,(vp.clientWidth-30)/1650);tx=20;ty=45;transform()};
["all","req","unlock"].forEach(id=>document.querySelector("#"+id).onclick=()=>{mode=id;document.querySelectorAll("header .btn").forEach(b=>b.classList.remove("on"));document.querySelector("#"+id).classList.add("on");highlight()});
document.querySelector("#close").onclick=()=>{selected=null;document.querySelector("#panel").style.display="none";highlight()};
document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{prog[selected.id]=b.dataset.s;localStorage.setItem("utn-map-progress",JSON.stringify(prog));drawNodes();select(selected)});
document.querySelector("#google").onclick=()=>alert("El proyecto mantiene preparado el punto de integración con Google/Firebase. Para sincronización real hay que agregar tu configuración Firebase.");
initial();drawNodes();transform();document.querySelector("#all").classList.add("on");
</script></body></html>
